name: Build APK

# Builds the app on every push / PR and on demand. No release, no Telegram, no LSPosed sync.
# Works on a fork without any secrets: without a keystore the release build is signed with the
# debug key (see android/app/build.gradle.kts). Add the secrets below to sign with your own key.
on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Java
        uses: actions/setup-java@v4.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.1.0
        with:
          gradle-version: wrapper
          cache-disabled: false

      # Optional: only when KEYSTORE_BASE64 (+ the three below) exist as repository secrets.
      - name: Decode keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No KEYSTORE_BASE64 secret: APK will be signed with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version
        id: version
        run: |
          NAME=$(grep '^appVersionName=' android/gradle.properties | cut -d'=' -f2)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && 'release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash android/gradlew -p android :app:assembleRelease \
            -PbuildTime="$(date -u '+%Y-%m-%d %H:%M')"

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.0
        with:
          name: HyperIsland-v${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
